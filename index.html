<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hybrid Plan</title>
<meta name="description" content="Running + strength plan tracker">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hybrid Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f3;
  --surface: #ffffff;
  --surface-2: #f0efea;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #7a7873;
  --line: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #1c5cab;
  --accent-ink: #ffffff;
  --run: #2a78d6;
  --lift: #eb6834;
  --good: #0ca30c;
  --good-ink: #006300;
  --crit: #d03b3b;
  --warn-bg: #fff4d6;
  --warn-ink: #6b4a00;
  --moved: #6250d6;
  --skip: #a9a79e;
  --upcoming: #e6e5df;
  --plan-fill: #e9e8e2;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --radius: 14px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110;
    --surface: #1a1a19;
    --surface-2: #242422;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --line: #2c2c2a;
    --axis: #45443f;
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --run: #3987e5;
    --lift: #d95926;
    --good: #0ca30c;
    --good-ink: #3fc93f;
    --crit: #e66767;
    --warn-bg: #3a2f12;
    --warn-ink: #ffd98a;
    --moved: #9085e9;
    --skip: #5f5e58;
    --upcoming: #2a2a28;
    --plan-fill: #2c2c2a;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #242422; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
  --line: #2c2c2a; --axis: #45443f; --accent: #3987e5; --run: #3987e5; --lift: #d95926; --good-ink: #3fc93f;
  --crit: #e66767; --warn-bg: #3a2f12; --warn-ink: #ffd98a; --moved: #9085e9; --skip: #5f5e58; --upcoming: #2a2a28;
  --plan-fill: #2c2c2a; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font);
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.1rem; }
small, .small { font-size: .82rem; color: var(--ink-2); }
.muted { color: var(--muted); }

/* Header */
.hdr {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  border-bottom: 1px solid var(--line); padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
}
.hdr-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 700; font-size: 1.05rem; flex: 1; min-width: 0; }
.brand small { display: block; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { display: flex; align-items: center; gap: 8px; }
.sync-status { font-size: .78rem; color: var(--ink-2); text-align: right; max-width: 150px; line-height: 1.2; }
.sync-status.err { color: var(--crit); }
.btn-sync {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .9rem;
}
.btn-sync svg { width: 16px; height: 16px; }
.btn-sync.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Navigation */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--surface);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.nav button {
  flex: 1; border: 0; background: none; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center;
  gap: 2px; font-size: .72rem; color: var(--muted); min-height: 58px;
}
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }

main { max-width: 680px; margin: 0 auto; padding: 14px 16px 24px; }
main.wide { max-width: 1240px; }

/* Day / week header */
.pager { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
.pager > div { flex: 1; text-align: center; min-width: 0; }
.pager p { margin: 2px 0 0; color: var(--ink-2); font-size: .9rem; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  font-size: 1.3rem; display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px 4px; min-height: 40px; }
.center { text-align: center; }

/* Cards */
.card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line);
  padding: 14px 14px 12px; margin-bottom: 14px; border-left: 5px solid var(--run);
}
.card.lift { border-left-color: var(--lift); }
.card.is-done { border-left-color: var(--good); }
.card.is-skipped { opacity: .7; border-left-color: var(--skip); }
.card-top { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.badge, .chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 2px 8px;
  border-radius: 999px; background: var(--surface-2); color: var(--ink-2); letter-spacing: .01em;
}
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--run); }
.badge.lift::before { background: var(--lift); }
.chip.moved { color: var(--moved); }
.chip.test { background: var(--warn-bg); color: var(--warn-ink); }
.chip.race { background: var(--accent); color: var(--accent-ink); }
.card h2 { font-size: 1.12rem; margin: 2px 0 6px; }
.details { margin: 0 0 12px; padding-left: 18px; font-size: .93rem; color: var(--ink); }
.details li { margin: 3px 0; }
.details li.hdr-line { list-style: none; margin-left: -18px; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg); padding: 4px 8px; border-radius: 8px; }
.btn-done {
  width: 100%; min-height: 56px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 1.1rem;
}
.btn-done.is-done { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good-ink); border: 1px solid var(--good); }
.btn-done.is-skipped { background: var(--surface-2); color: var(--ink-2); }
.card-actions { display: flex; gap: 6px; margin-top: 8px; }
.card-actions button, .btn {
  flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 600; font-size: .92rem; padding: 0 12px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .5; }
.logged { margin-top: 10px; font-size: .86rem; color: var(--ink-2); background: var(--surface-2); padding: 8px 10px; border-radius: 10px; }

/* Log form */
.logform { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 12px; }
.logform label, .fld { display: grid; gap: 4px; font-size: .86rem; font-weight: 600; color: var(--ink-2); }
.logform input, .logform select, .logform textarea, .field {
  width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  padding: 8px 10px; font-size: 16px; font-weight: 400; color: var(--ink);
}
.logform textarea { min-height: 70px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rpe label { position: relative; }
.rpe input { position: absolute; opacity: 0; pointer-events: none; }
.rpe span {
  display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-weight: 600;
}
.rpe input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.lift-row { display: grid; grid-template-columns: 1fr 84px 16px 70px; gap: 6px; align-items: center; font-size: .9rem; color: var(--ink); }
.lift-row input { min-height: 40px; }
.form-sub { font-weight: 700; font-size: .9rem; color: var(--ink); margin-top: 2px; }

/* Banner */
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
.banner-head { display: flex; align-items: center; gap: 8px; }
.banner-head strong { flex: 1; }
.banner-head button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; min-height: 40px; }
.missed-row { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--warn-ink) 20%, transparent); }
.missed-row > div { flex: 1; min-width: 0; color: var(--ink); }
.missed-row b { display: block; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.missed-row button { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; padding: 0 12px; color: var(--ink); }
.empty { background: var(--surface); border: 1px dashed var(--axis); border-radius: var(--radius); padding: 20px 16px; text-align: center; color: var(--ink-2); }
.empty h2 { color: var(--ink); margin-bottom: 4px; }

/* Week view */
.blocks { display: flex; gap: 3px; margin: 0 0 12px; }
.blocks div { flex: 1; text-align: center; font-size: .68rem; padding: 6px 2px; border-radius: 6px; background: var(--surface-2); color: var(--muted); line-height: 1.15; }
.blocks div.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.weeknote { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .9rem; margin: 0 0 12px; color: var(--ink-2); }
.meter { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 4px 0 14px; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
.day { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.day.today .dname { color: var(--accent); }
.dname { font-weight: 700; font-size: .95rem; }
.dname small { display: block; font-weight: 400; }
.srow { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
.srow-main { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 10px 12px; min-height: 48px; }
.srow-main .t { flex: 1; min-width: 0; font-weight: 600; font-size: .95rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--run); flex: none; }
.dot.lift { background: var(--lift); }
.st { font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); flex: none; }
.st-done { color: var(--good-ink); background: color-mix(in srgb, var(--good) 15%, var(--surface)); }
.st-missed { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, var(--surface)); }
.st-moved { color: var(--moved); background: color-mix(in srgb, var(--moved) 14%, var(--surface)); }
.st-skipped { color: var(--ink-2); text-decoration: line-through; }
.srow-body { padding: 0 12px 12px; }
.srow-actions { display: flex; gap: 6px; padding: 0 12px 10px; }
.srow-actions button { flex: 1; min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; }
.srow-actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ghost { font-size: .84rem; color: var(--muted); padding: 4px 2px 8px; font-style: italic; }
.rest { color: var(--muted); font-size: .92rem; padding: 12px 0; }

/* Modal */
.modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.modal {
  background: var(--surface); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height: 90vh; overflow: auto;
}
@media (min-width: 600px) { .modal-bg { align-items: center; } .modal { border-radius: 18px; } }
.modal p { margin: 4px 0 12px; color: var(--ink-2); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.quick button { min-height: 40px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); padding: 0 14px; font-weight: 600; font-size: .88rem; }
.quick button.on { border-color: var(--accent); color: var(--accent); }
.warns { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 10px 12px; margin: 12px 0; font-size: .9rem; }
.warns ul { margin: 6px 0 0; padding-left: 18px; }
.oknote { color: var(--good-ink); font-size: .9rem; margin: 12px 0; }
.modal-actions { display: flex; gap: 8px; margin-top: 14px; }

/* Toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 60;
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; gap: 12px;
  align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px); font-size: .92rem;
}
.toast button { border: 0; background: none; color: var(--bg); font-weight: 700; text-decoration: underline; min-height: 36px; }

/* Settings */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.panel h2 { margin-bottom: 8px; }
.panel p { margin: 6px 0; font-size: .92rem; color: var(--ink-2); }
.panel .btn { margin-top: 8px; width: 100%; }
.panel code { font-size: .85rem; word-break: break-all; }
.warnbox { background: var(--warn-bg); color: var(--warn-ink); padding: 10px 12px; border-radius: 10px; font-size: .88rem; margin: 10px 0; }
textarea.code { width: 100%; min-height: 80px; font: 13px ui-monospace, Menlo, monospace; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 8px; }
.stack { display: grid; gap: 8px; }
ol.steps { margin: 6px 0 4px; padding-left: 20px; font-size: .9rem; color: var(--ink-2); }

/* Progress */
.dash { display: grid; gap: 14px; grid-template-columns: 1fr; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .v { font-size: 1.7rem; font-weight: 700; line-height: 1.1; margin-top: 2px; }
.tile .k { font-size: .8rem; color: var(--ink-2); font-weight: 600; }
.tile .s { font-size: .78rem; color: var(--muted); }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.pcard h2 { font-size: 1rem; margin-bottom: 2px; }
.pcard > p.sub { margin: 0 0 10px; font-size: .82rem; color: var(--muted); }
.chart { width: 100%; min-height: 40px; }
.chart svg { display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--ink-2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend i.ln { height: 3px; border-radius: 2px; vertical-align: 3px; width: 14px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px) !important; height: 2px; vertical-align: 3px; width: 16px; }
details.tbl { margin-top: 8px; font-size: .82rem; }
details.tbl summary { cursor: pointer; color: var(--accent); font-weight: 600; min-height: 32px; display: flex; align-items: center; }
details.tbl table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
details.tbl th, details.tbl td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
.heat { display: grid; grid-template-columns: 64px repeat(7, 1fr); gap: 3px; font-size: .7rem; }
.heat .hd { color: var(--muted); text-align: center; }
.heat .wl { color: var(--ink-2); white-space: nowrap; align-self: center; font-variant-numeric: tabular-nums; }
.heat .wl.cur { color: var(--accent); font-weight: 700; }
.hc { aspect-ratio: 1.6; border-radius: 4px; background: var(--surface-2); border: 0; padding: 0; position: relative; min-height: 16px; }
.hc.done { background: var(--good); }
.hc.missed { background: var(--crit); }
.hc.moved { background: var(--moved); }
.hc.skipped { background: var(--skip); }
.hc.upcoming { background: var(--upcoming); box-shadow: inset 0 0 0 1px var(--axis); }
.hc.rest { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.hc.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.hc.race::after { content: "\2605"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: 10px; }
.hc.race.done::after, .hc.race.missed::after, .hc.race.moved::after { color: #fff; }
.ladder { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; }
.ladder li { display: flex; gap: 8px; align-items: center; font-size: .86rem; color: var(--muted); }
.ladder li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--axis); flex: none; }
.ladder li.past { color: var(--ink-2); }
.ladder li.past::before { background: var(--good); border-color: var(--good); }
.ladder li.cur { color: var(--ink); font-weight: 700; }
.ladder li.cur::before { background: var(--accent); border-color: var(--accent); }
.nextstep { margin-top: 8px; font-size: .86rem; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li { border-top: 1px solid var(--line); padding: 8px 0; font-size: .9rem; }
.notes li:first-child { border-top: 0; }
.notes .meta { font-size: .78rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.rpechip { font-weight: 700; color: var(--ink); }
.two { display: grid; gap: 14px; grid-template-columns: 1fr; }
.minis { display: grid; gap: 12px; grid-template-columns: 1fr; }
.mini h3 { font-size: .86rem; margin-bottom: 2px; }
.tip {
  position: fixed; z-index: 70; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem;
  padding: 6px 9px; border-radius: 8px; max-width: 240px; box-shadow: 0 4px 16px rgba(0,0,0,.2); display: none;
}
.hidden { display: none !important; }

@media (min-width: 900px) {
  body { padding-bottom: 24px; }
  .nav { position: static; border: 0; background: none; padding: 0; gap: 4px; }
  .nav button { flex: none; flex-direction: row; min-height: 40px; padding: 0 12px; font-size: .92rem; border-radius: 10px; gap: 6px; }
  .nav button svg { width: 18px; height: 18px; }
  .nav button[aria-current="page"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .toast { bottom: 24px; }
  .sync-status { max-width: 220px; }
  .dash { grid-template-columns: repeat(12, 1fr); }
  .dash > .tiles { grid-column: 1 / -1; grid-template-columns: repeat(5, 1fr); }
  .dash > .span-12 { grid-column: span 12; }
  .dash > .span-7 { grid-column: span 7; }
  .dash > .span-5 { grid-column: span 5; }
  .dash > .span-6 { grid-column: span 6; }
  .minis { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .two { grid-template-columns: 1fr 1fr; }
  .hc { aspect-ratio: auto; height: 18px; min-height: 0; }
  .heat { gap: 2px 3px; }
}
@media (max-width: 380px) {
  .sync-status { max-width: 92px; }
  .lift-row { grid-template-columns: 1fr 70px 12px 58px; }
}
</style>
</head>
<body>
<header class="hdr">

function toISO(dt) { return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate()); }

  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' h ago';

function saveForm(form) {

function weekStats() {

    const done = own.filter(s => statusOf(s) === 'done');
    const runs = own.filter(s => s.type === 'run');
    const actualKm = runs.reduce((a, s) => a + runActualKm(s), 0);
    const long = own.find(s => s.kind === 'long');
    return {

      plannedRuns: runs.length, plannedLifts: own.length - runs.length,
      plannedKm: runs.reduce((a, s) => a + (s.plannedKm || 0), 0), actualKm,
      longPlanned: long ? long.plannedKm : null, longActual: long && statusOf(long) === 'done' ? runActualKm(long) : null,

}

function pullReady(step, t) {
  if (step === 0) return (t.neg || 0) >= 10 && (t.hang || 0) >= 30;
  if (step === 3) return (t.neg || 0) >= 15;
  if (step === 5) return (t.strict || 0) >= 3;
  return false;
}
function strengthSeries() {
  const out = {};
  SESS.forEach(s => {
    const r = rec(s.id);
    if (!r.lifts) return;
    Object.keys(r.lifts).forEach(k => {
      const v = r.lifts[k];
      if (!v || !v.w) return;
      (out[k] = out[k] || []).push({ d: r.completedOn || eff(s), w: v.w, r: v.r });
    });
  });
  Object.values(out).forEach(a => a.sort((x, y) => x.d.localeCompare(y.d)));
  return out;
}
function dayStatus(d) {
  const list = sessionsOn(d);
  const movedAway = SESS.some(s => s.date === d && eff(s) !== d);
  if (!list.length) return movedAway ? 'moved' : 'rest';
  const sts = list.map(statusOf);
  if (sts.includes('missed')) return 'missed';
  if (sts.every(x => x === 'done')) return 'done';
  if (sts.some(x => x === 'planned' || x === 'moved')) return d < TODAY ? 'missed' : (sts.every(x => x === 'moved') ? 'moved' : 'upcoming');
  if (sts.every(x => x === 'skipped')) return 'skipped';
  return 'done';
}

function tile(k, v, s) { return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + '</div></div>'; }
function legend(items) { return '<div class="legend">' + items.map(([c, l, kind]) => '<span><i class="' + (kind || '') + '" style="background:' + c + '"></i>' + esc(l) + '</span>').join('') + '</div>'; }
function emptyState(t, b) { return '<div class="empty"><h2>' + esc(t) + '</h2><p class="small">' + esc(b) + '</p></div>'; }
function table(head, rows) { return '<details class="tbl"><summary>Show as table</summary><table><thead><tr>' + head.map(x => '<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(x => '<td>' + esc(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></details>'; }

function viewSkills() {
  const tests = testResults();
  const testDates = SESS.filter(s => s.test).map(s => fmtShort(s.date)).join(', ');
  let h = '<section class="pcard span-12"><h2>Pull-up and push-up</h2><p class="sub">Test every other Monday (' + esc(testDates) + '). Log it with Add details on the Lift B test card.</p>';

  const pullT = tests.filter(x => x.t.hang || x.t.neg || x.t.band || x.t.strict != null);
  const pushT = tests.filter(x => x.t.pushReps);

  const step = pullStep(lastPull);
  h += '<div><h3>Pull-up</h3>' + (pullT.length ? legend([['var(--run)', 'Best negative (s)', 'ln'], ['var(--lift)', 'Dead hang (s)', 'ln']]) + '<div class="chart" data-chart="pull"></div>' : '<p class="small">No pull-up results yet.</p>') +
    '<ol class="ladder">' + PULL_LADDER.map((l, i) => '<li class="' + (i < step ? 'past' : i === step ? 'cur' : '') + '">' + esc(l.name) + (i === step ? ' (you are here)' : '') + '</li>').join('') + '</ol>' +
    '<div class="nextstep"><b>Next:</b> ' + esc(PULL_LADDER[step].next) + (lastPull && pullReady(step, lastPull) ? ' <b>Your last test says you are ready.</b>' : '') +
    (lastPull && lastPull.strict ? '<br>Strict reps at last test: <b>' + lastPull.strict + '</b>' : '') + '</div></div>';
  // push-up
  const lastPush = pushT.length ? pushT[pushT.length - 1].t : null;
  const pi = lastPush ? Math.max(0, PUSH_STEPS.findIndex(p => p[0] === lastPush.incline)) : 0;
  const floorDone = lastPush && lastPush.incline === 'floor' && lastPush.pushReps >= 10;
  h += '<div><h3>Push-up</h3>' + (pushT.length ? legend([['var(--run)', 'Clean reps at test', 'ln']]) + '<div class="chart" data-chart="push"></div>' : '<p class="small">No push-up results yet.</p>') +
    '<ol class="ladder">' + PUSH_STEPS.map((p, i) => '<li class="' + (i < pi ? 'past' : i === pi ? 'cur' : '') + '">' + esc(p[1]) + (i === pi ? ' (you are here)' : '') + '</li>').join('') + '</ol>' +
    '<div class="nextstep"><b>Next:</b> ' + (pi === PUSH_STEPS.length - 1 ? (floorDone ? 'You hit 10 floor reps. Build to 3 x 10 in practice.' : 'Build floor push-ups to 3 x 10.') :
      'When you get 3 x 10 clean reps at ' + esc(PUSH_STEPS[pi][1]) + ', move to ' + esc(PUSH_STEPS[pi + 1][1]) + '.') +
    (lastPush && lastPush.pushReps >= 10 && pi < PUSH_STEPS.length - 1 ? ' <b>Your last test hit 10+, try one step lower.</b>' : '') + '</div></div>';
  h += '</div>' + table(['Date', 'Hang (s)', 'Negative (s)', 'Band', 'Strict', 'Incline', 'Push-ups'], tests.map(x => [fmtShort(x.d), x.t.hang || '', x.t.neg || '', x.t.band || '', x.t.strict == null ? '' : x.t.strict, x.t.incline || '', x.t.pushReps || '']));
  return h + '</section>';
}

function viewNotes() {
  const items = SESS.filter(s => rec(s.id).note || rec(s.id).rpe).map(s => ({ s, r: rec(s.id) }))
    .sort((a, b) => ((b.r.completedOn || eff(b.s)).localeCompare(a.r.completedOn || eff(a.s))) || ((b.r.updatedAt || 0) - (a.r.updatedAt || 0))).slice(0, 20);
  let h = '<section class="pcard span-12"><h2>Recent notes and RPE</h2><p class="sub">Newest first.</p>';
  if (!items.length) return h + emptyState('No notes yet', 'Add an RPE or a note with Add details after a session.') + '</section>';

  return h + '</section>';

// ------------------------------------------------------------------ charts (inline SVG, no libraries)
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function yScale(max, count) { const step = niceStep((max || 1) / (count || 4)); const top = Math.max(step, Math.ceil((max || 1) / step) * step); const ticks = []; for (let v = 0; v <= top + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100); return { top, ticks }; }
function topRounded(x, y, w, h, r) {
  if (h <= 0 || w <= 0) return '';
  r = Math.min(r, w / 2, h);
  return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
}
function frame(W, H, M, ys, fmtY) {
  let g = '';
  ys.ticks.forEach(v => {
    const y = M.t + (H - M.t - M.b) * (1 - v / ys.top);
    g += '<line x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + y + '" y2="' + y + '" style="stroke:' + (v === 0 ? 'var(--axis)' : 'var(--line)') + ';stroke-width:1"/>';
    g += '<text x="' + (M.l - 6) + '" y="' + (y + 4) + '" text-anchor="end" style="font-variant-numeric:tabular-nums">' + (fmtY ? fmtY(v) : v) + '</text>';
  });
  return g;
}
function weekBars(el, stats, mode) {
  const W = Math.max(280, el.clientWidth || 600), H = 200, M = { l: 34, r: 6, t: 10, b: 24 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b, band = pw / stats.length;
  const max = mode === 'adherence' ? Math.max(...stats.map(w => w.planned)) : Math.max(...stats.map(w => Math.max(w.plannedKm, w.actualKm)));
  const ys = yScale(max, 4);
  const Y = v => M.t + ph * (1 - v / ys.top);
  let g = frame(W, H, M, ys);
  const showEvery = band < 26 ? 2 : 1;
  stats.forEach((w, i) => {
    const x0 = M.l + i * band;
    if (mode === 'adherence') {
      const bw = Math.max(4, band * 0.62), x = x0 + (band - bw) / 2;
      g += '<path d="' + topRounded(x, Y(w.planned), bw, ph - (Y(w.planned) - M.t), 4) + '" style="fill:var(--plan-fill)"/>';
      const hr = ph * w.doneRuns / ys.top, hl = ph * w.doneLifts / ys.top;
      const base = M.t + ph;
      if (w.doneRuns) g += (w.doneLifts ? '<rect x="' + x + '" y="' + (base - hr) + '" width="' + bw + '" height="' + hr + '" style="fill:var(--run)"/>' : '<path d="' + topRounded(x, base - hr, bw, hr, 4) + '" style="fill:var(--run)"/>');
      if (w.doneLifts) g += '<path d="' + topRounded(x, base - hr - hl - (w.doneRuns ? 2 : 0), bw, hl, 4) + '" style="fill:var(--lift)"/>';
      g += '<rect x="' + x0 + '" y="' + M.t + '" width="' + band + '" height="' + ph + '" fill="transparent" data-tip="' + esc('Week ' + w.n + ' (' + fmtShort(w.start) + '): ' + (w.doneRuns + w.doneLifts) + ' of ' + w.planned + ' done · ' + w.doneRuns + '/' + w.plannedRuns + ' runs, ' + w.doneLifts + '/' + w.plannedLifts + ' lifts') + '"/>';
    } else {
      const bw = Math.max(3, band * 0.34), gap = 2, x = x0 + (band - 2 * bw - gap) / 2;
      g += '<path d="' + topRounded(x, Y(w.plannedKm), bw, ph - (Y(w.plannedKm) - M.t), 3) + '" style="fill:var(--plan-fill)"/>';
      if (w.actualKm) g += '<path d="' + topRounded(x + bw + gap, Y(w.actualKm), bw, ph - (Y(w.actualKm) - M.t), 3) + '" style="fill:var(--run)"/>';
      g += '<rect x="' + x0 + '" y="' + M.t + '" width="' + band + '" height="' + ph + '" fill="transparent" data-tip="' + esc('Week ' + w.n + ': ' + w.actualKm.toFixed(1) + ' km done of ' + w.plannedKm.toFixed(1) + ' km planned') + '"/>';
    }
    if (i % showEvery === 0) g += '<text x="' + (x0 + band / 2) + '" y="' + (H - 7) + '" text-anchor="middle"' + (w.current ? ' style="font-weight:700;fill:var(--ink)"' : '') + '>' + w.n + '</text>';
  });
  el.innerHTML = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + (mode === 'adherence' ? 'Weekly adherence chart' : 'Weekly running volume chart') + '">' + g + '</svg>';
}
// series: [{color, dashed, points:[{x, y, tip}]}]; x numeric
function lineChart(el, opt) {
  const W = Math.max(240, el.clientWidth || 500), H = opt.height || 170, M = { l: 34, r: 12, t: 12, b: 24 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  const allY = opt.series.flatMap(s => s.points.map(p => p.y));
  const ys = yScale(Math.max(...allY, 1) * 1.05, 4);
  const X = x => M.l + (opt.xMax === opt.xMin ? pw / 2 : pw * (x - opt.xMin) / (opt.xMax - opt.xMin));
  const Y = v => M.t + ph * (1 - v / ys.top);
  let g = frame(W, H, M, ys);
  (opt.xTicks || []).forEach(t => { g += '<text x="' + X(t.x) + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(t.label) + '</text>'; });
  opt.series.forEach(s => {
    const pts = s.points;
    if (pts.length > 1) g += '<path d="' + pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('') + '" style="fill:none;stroke:' + s.color + ';stroke-width:2;stroke-linejoin:round;stroke-linecap:round' + (s.dashed ? ';stroke-dasharray:4 4' : '') + '"/>';
    pts.forEach(p => {
      g += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="' + (s.dashed ? 2.5 : 4) + '" style="fill:' + s.color + ';stroke:var(--surface);stroke-width:2"/>';
      if (p.tip) g += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="14" fill="transparent" data-tip="' + esc(p.tip) + '"/>';
    });
  });
  el.innerHTML = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(opt.label || 'chart') + '">' + g + '</svg>';
}
function dayIdx(d) { return diffDays(PLAN.start, d); }
function monthTicks() {
  const out = [];
  let d = PLAN.start.slice(0, 8) + '01';
  for (let i = 0; i < 6; i++) { const nd = toISO(new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1 + i, 1))); if (nd >= PLAN.start && nd <= PLAN.end) out.push({ x: dayIdx(nd), label: MONTHS[+nd.slice(5, 7) - 1] }); }
  return out;
}
function drawCharts() {
  const stats = weekStats();
  document.querySelectorAll('[data-chart]').forEach(el => {
    const kind = el.dataset.chart;
    if (kind === 'adherence' || kind === 'volume') weekBars(el, stats, kind);
    else if (kind === 'long') {
      const pl = stats.filter(w => w.longPlanned).map(w => ({ x: w.n, y: w.longPlanned, tip: 'Week ' + w.n + ' planned: ' + w.longPlanned + ' km' }));
      const ac = stats.filter(w => w.longActual).map(w => ({ x: w.n, y: w.longActual, tip: 'Week ' + w.n + ' long run: ' + w.longActual + ' km' }));
      lineChart(el, { xMin: 1, xMax: PLAN.weeks.length, label: 'Long run distance by week', series: [{ color: 'var(--muted)', dashed: true, points: pl }, { color: 'var(--run)', points: ac }], xTicks: PLAN.weeks.filter(w => w.n % 2 === 1).map(w => ({ x: w.n, label: 'W' + w.n })) });
    } else if (kind === 'lift') {
      const pts = strengthSeries()[el.dataset.k].map(p => ({ x: dayIdx(p.d), y: p.w, tip: fmtShort(p.d) + ': ' + p.w + ' kg x ' + (p.r || '?') }));
      lineChart(el, { xMin: 0, xMax: dayIdx(PLAN.end), height: 140, label: KEY_LIFTS[el.dataset.k] + ' top set over time', series: [{ color: 'var(--lift)', points: pts }], xTicks: monthTicks() });
    } else if (kind === 'pull' || kind === 'push') {
      const tests = testResults();
      const xt = SESS.filter(s => s.test).map(s => ({ x: dayIdx(s.date), label: fmtShort(s.date) })).filter((_, i) => i % 2 === 0);
      const series = kind === 'pull'
        ? [{ color: 'var(--run)', points: tests.filter(x => x.t.neg).map(x => ({ x: dayIdx(x.d), y: x.t.neg, tip: fmtShort(x.d) + ': negative ' + x.t.neg + ' s' + (x.t.strict ? ', ' + x.t.strict + ' strict' : '') })) },
           { color: 'var(--lift)', points: tests.filter(x => x.t.hang).map(x => ({ x: dayIdx(x.d), y: x.t.hang, tip: fmtShort(x.d) + ': hang ' + x.t.hang + ' s' })) }]
        : [{ color: 'var(--run)', points: tests.filter(x => x.t.pushReps).map(x => ({ x: dayIdx(x.d), y: x.t.pushReps, tip: fmtShort(x.d) + ': ' + x.t.pushReps + ' reps at ' + ((PUSH_STEPS.find(p => p[0] === x.t.incline) || ['', 'incline ?'])[1]) })) }];
      lineChart(el, { xMin: 0, xMax: dayIdx(PLAN.end), height: 150, label: kind === 'pull' ? 'Pull-up test results' : 'Push-up test results', series, xTicks: xt });
    }
  });
}

      '<div class="stack"><input class="field" id="tok" type="password" autocomplete="off" placeholder="ghp_..." aria-label="GitHub token"><button class="btn primary" data-a="create-gist">Create sync file</button></div>' +
      '<h3 style="margin-top:16px">Second device</h3><ol class="steps"><li>On the first device, open Settings and tap Copy setup code.</li><li>Paste it here.</li></ol>' +
      '<div class="stack"><input class="field" id="code" type="password" autocomplete="off" placeholder="HT1-..." aria-label="Setup code"><button class="btn" data-a="connect-code">Connect</button></div>';
  }
  h += '</section><section class="panel"><h2>Backup</h2><p>A safety net. Import merges with what is here (newest change per field wins), so it never erases newer edits.</p>' +
    '<button class="btn" data-a="export">Export backup (JSON)</button><button class="btn" data-a="import">Import backup</button><input type="file" id="import-file" accept="application/json,.json" class="hidden">' +
    '<button class="btn" data-a="csv">Download my data (CSV)</button></section>';
  const changed = Object.keys(S.records).length;
  h += '<section class="panel"><h2>About</h2><p>Plan version ' + esc(PLAN.version) + ' · ' + SESS.length + ' sessions from ' + esc(fmtDay(PLAN.start)) + ' to ' + esc(fmtDay(PLAN.end)) + '.</p><p>' + changed + ' sessions have your changes. Data is saved in this browser and works offline.</p></section>';
  return h;
}

// ------------------------------------------------------------------ backup / CSV
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportBackup() {
  download('hybrid-tracker-backup-' + TODAY + '.json', JSON.stringify({ app: 'hybrid-tracker', kind: 'backup', version: 1, planVersion: PLAN.version, exportedAt: new Date().toISOString(), records: S.records }, null, 1), 'application/json');
  toast('Backup downloaded');
}
function importBackup(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      if (!data || typeof data.records !== 'object') throw new Error('not a backup');
      const clean = sanitizeRecords(data.records);
      const { merged } = mergeRecords(S.records, clean, Infinity);
      S.records = merged;
      bumpClock();
      saveState();
      CFG.dirty = true; saveCfg();
      render();
      toast('Imported ' + Object.keys(clean).length + ' sessions');
      scheduleSync();
    } catch (e) { toast('That file is not a valid backup.'); }
  };
  fr.readAsText(file);
}
function csvCell(v) { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCSV() {
  const head = ['id', 'week', 'block', 'planned_date', 'actual_date', 'type', 'lift', 'kind', 'title', 'status', 'completed_on', 'moved_from', 'planned_km', 'planned_min', 'actual_km', 'actual_min', 'rpe', 'top_sets', 'pullup_hang_s', 'pullup_negative_s', 'pullup_band', 'pullup_strict', 'pushup_incline', 'pushup_reps', 'note'];
  const rows = SESS.map(s => {
    const r = rec(s.id), t = r.test || {}, w = PLAN.weeks[s.week - 1];
    const lifts = r.lifts ? Object.keys(r.lifts).map(k => KEY_LIFTS[k] + ' ' + (r.lifts[k].w || '') + 'x' + (r.lifts[k].r || '')).join('; ') : '';
    return [s.id, s.week, w.block, s.date, eff(s), s.type, s.lift || '', s.kind, s.title, statusOf(s), r.completedOn || '', r.movedTo && r.movedTo !== s.date ? s.date : '', s.plannedKm || '', s.plannedMin || '', r.km || '', r.min || '', r.rpe || '', lifts, t.hang || '', t.neg || '', t.band || '', t.strict == null ? '' : t.strict, t.incline || '', t.pushReps || '', r.note || ''];
  });
  download('hybrid-tracker-' + TODAY + '.csv', [head, ...rows].map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
}

// ------------------------------------------------------------------ sync (private GitHub Gist)
function sanitizeRecords(obj) {
  const out = {};
  if (!obj || typeof obj !== 'object') return out;
  Object.keys(obj).forEach(id => { const r = obj[id]; if (r && typeof r === 'object' && r.t && typeof r.t === 'object') out[id] = r; });
  return out;
}
const sameVal = (a, b) => JSON.stringify(a == null ? null : a) === JSON.stringify(b == null ? null : b);
// Field-level merge: for every session and every field, the newer timestamp wins.
// A conflict = the same field changed on both sides since the last sync, to different values.
function mergeRecords(local, remote, since) {
  const out = {};
  let conflicts = 0;
  const ids = new Set([...Object.keys(local || {}), ...Object.keys(remote || {})]);
  ids.forEach(id => {
    const L = local[id] || { t: {} }, R = remote[id] || { t: {} }, Lt = L.t || {}, Rt = R.t || {};
    const m = { t: {} };
    new Set([...Object.keys(Lt), ...Object.keys(Rt)]).forEach(k => {
      const lt = Lt[k] || 0, rt = Rt[k] || 0, lv = L[k], rv = R[k];
      if (lt > since && rt > since && !sameVal(lv, rv)) conflicts++;
      const useL = lt > rt || (lt === rt && JSON.stringify(lv == null ? null : lv) >= JSON.stringify(rv == null ? null : rv));
      m[k] = useL ? (lv === undefined ? null : lv) : (rv === undefined ? null : rv);
      m.t[k] = useL ? lt : rt;
    });
    m.updatedAt = Math.max(0, ...Object.values(m.t));
    out[id] = m;
  });
  return { merged: out, conflicts };
}
function bumpClock() { let mx = S.lastTs || 0; Object.values(S.records).forEach(r => { if (r.updatedAt > mx) mx = r.updatedAt; }); S.lastTs = mx; }
function setupCode() { return 'HT1-' + btoa(JSON.stringify({ t: CFG.token, g: CFG.gistId })).replace(/=+$/, ''); }
function parseSetupCode(code) {
  const c = (code || '').trim().replace(/\s+/g, '');
  if (!/^HT1-/.test(c)) return null;
  try { let b = c.slice(4); while (b.length % 4) b += '='; const o = JSON.parse(atob(b)); return o.t && o.g ? o : null; } catch (e) { return null; }
}
async function gh(path, opts) {
  opts = opts || {};
  const headers = { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + CFG.token };
  if (opts.body) headers['Content-Type'] = 'application/json';
  const res = await fetch(API + path, { method: opts.method || 'GET', headers, body: opts.body, cache: 'no-store' });
  if (!res.ok) { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
  return res.json();
}
async function readRemote() {
  const g = await gh('/gists/' + CFG.gistId);
  const f = g.files && g.files[GIST_FILE];
  if (!f) return { records: {} };
  let content = f.content;
  if (f.truncated && f.raw_url) content = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  let data;
  try { data = JSON.parse(content || '{}'); } catch (e) { const err = new Error('Sync file is damaged'); err.status = 'parse'; throw err; }
  return { records: sanitizeRecords(data.records) };
}
function remotePayload(records) { return JSON.stringify({ app: 'hybrid-tracker', version: 1, planVersion: PLAN.version, updatedAt: new Date().toISOString(), records }); }
async function writeRemote(records) { await gh('/gists/' + CFG.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: remotePayload(records) } } }) }); }

let syncTimer = null, syncAgain = false;
function scheduleSync(ms) {
  if (!CFG.token || !CFG.gistId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => sync('auto'), ms == null ? 4000 : ms);
}
function errText(e) {
  if (e && (e.status === 401 || e.status === 403)) return 'Token rejected. Use a classic token with the gist scope.';
  if (e && e.status === 404) return 'Sync file not found. Check the setup code.';
  if (e && e.status === 'parse') return 'Sync file is damaged. Your local data is safe.';
  if (e && e.status) return 'Sync failed (' + e.status + '). Will retry.';
  return 'Offline. Saved here, will sync later.';
}
async function sync(reason) {
  if (!CFG.token || !CFG.gistId) { if (reason === 'manual') { UI.view = 'settings'; render(); toast('Set up sync first'); } return; }
  if (UI.syncing) { syncAgain = true; return; }
  UI.syncing = true; renderSync();
  const wasDirty = CFG.dirty;
  try {
    const remote = await readRemote();
    // Merge whatever is local right now (including edits made while we were reading).
    const { merged, conflicts } = mergeRecords(S.records, remote.records, CFG.lastSyncMark || 0);
    S.records = merged;
    bumpClock();
    saveState();
    const afterMerge = S.lastTs;
    if (JSON.stringify(sortObj(merged)) !== JSON.stringify(sortObj(remote.records))) await writeRemote(merged);
    CFG.lastSyncAt = Date.now();
    CFG.lastSyncMark = afterMerge;
    CFG.dirty = S.lastTs !== afterMerge; // edited while uploading: push again next time
    CFG.lastError = '';
    saveCfg();
    if (conflicts) toast(conflicts + ' conflicting edit' + (conflicts === 1 ? '' : 's') + ' merged (newest kept).');
    else if (reason === 'manual') toast('Synced');
  } catch (e) {
    CFG.lastError = errText(e);
    CFG.dirty = CFG.dirty || wasDirty;
    saveCfg();
    if (reason === 'manual') toast(CFG.lastError);
  } finally {
    UI.syncing = false;
    render();
    if (syncAgain) { syncAgain = false; scheduleSync(500); }
  }
}
function sortObj(o) {
  if (Array.isArray(o)) return o.map(sortObj);
  if (o && typeof o === 'object') { const r = {}; Object.keys(o).sort().forEach(k => { r[k] = sortObj(o[k]); }); return r; }
  return o;
}
async function createGist() {
  const tok = ($('#tok').value || '').trim();
  if (!tok) return toast('Paste your token first');
  CFG.token = tok;
  try {
    const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Hybrid plan tracker data (private, used by the tracker app)', public: false, files: { [GIST_FILE]: { content: remotePayload(S.records) } } }) });
    CFG.gistId = g.id; CFG.lastSyncAt = Date.now(); CFG.lastSyncMark = S.lastTs; CFG.dirty = false; CFG.lastError = '';
    saveCfg(); render();
    toast('Sync file created. Copy the setup code for your other device.');
  } catch (e) {
    CFG.token = ''; saveCfg();
    toast(errText(e));
  }
}
async function connectCode() {
  const o = parseSetupCode($('#code').value);
  if (!o) return toast('That setup code does not look right.');
  CFG.token = o.t; CFG.gistId = o.g; CFG.lastSyncMark = 0; CFG.lastError = ''; saveCfg();
  UI.view = 'today';
  await sync('manual');
}
function syncText() {
  if (UI.syncing) return 'Syncing...';
  if (!CFG.token || !CFG.gistId) return 'Sync not set up';
  if (CFG.lastError) return CFG.lastError;
  if (!CFG.lastSyncAt) return 'Not synced yet';
  return 'Synced ' + relTime(CFG.lastSyncAt) + (CFG.dirty ? ' · changes waiting' : '');
}
function renderSync() {
  const el = $('#sync-status');
  el.textContent = syncText();
  el.className = 'sync-status' + (CFG.lastError ? ' err' : '');
  $('#btn-sync').classList.toggle('spin', UI.syncing);
}

// ------------------------------------------------------------------ toast + tooltip
let toastTimer = null;
function toast(msg, undo) {
  clearTimeout(toastTimer);
  const root = $('#toast-root');
  root.innerHTML = '<div class="toast" role="status"><span>' + esc(msg) + '</span>' + (undo ? '<button data-a="toast-undo">Undo</button>' : '') + '</div>';
  root._undo = undo || null;
  toastTimer = setTimeout(() => { root.innerHTML = ''; root._undo = null; }, undo ? 6000 : 3000);
}
const tipEl = () => $('#tip');
function showTip(target, x, y) {
  const t = tipEl();
  t.textContent = target.getAttribute('data-tip');
  t.style.display = 'block';
  const r = t.getBoundingClientRect();
  t.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2)) + 'px';
  t.style.top = Math.max(8, y - r.height - 12) + 'px';
}
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t) showTip(t, e.clientX, e.clientY); else tipEl().style.display = 'none';
});
let tipTimer = null;
document.addEventListener('pointerdown', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t || e.pointerType === 'mouse') return;
  showTip(t, e.clientX, e.clientY);
  clearTimeout(tipTimer); tipTimer = setTimeout(() => { tipEl().style.display = 'none'; }, 2500);
});

// ------------------------------------------------------------------ events
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'modal-bg') { if (e.target === b) { UI.move = null; closeModal(); } return; }
  switch (a) {
    case 'view': UI.view = b.dataset.v; if (UI.view === 'today') UI.viewDate = TODAY; if (UI.view === 'week') UI.weekN = null; render(); window.scrollTo(0, 0); break;
    case 'day': UI.viewDate = addDays(UI.viewDate, +b.dataset.n); UI.form = null; render(); break;
    case 'day-today': UI.viewDate = TODAY; render(); break;
    case 'goto-day': UI.view = 'today'; UI.viewDate = b.dataset.d; UI.form = b.dataset.form || null; render(); if (b.dataset.form) { const c = document.getElementById('card-' + b.dataset.form); if (c) c.scrollIntoView({ block: 'start' }); } break;
    case 'week': UI.weekN = Math.min(PLAN.weeks.length, Math.max(1, UI.weekN + +b.dataset.n)); render(); break;
    case 'week-now': UI.weekN = null; render(); break;
    case 'expand': UI.open.has(id) ? UI.open.delete(id) : UI.open.add(id); render(); break;
    case 'done': markDone(id); break;
    case 'undo': undoDone(id); break;
    case 'skip': skip(id); break;
    case 'unskip': { const before = snapshot(id, ['status']); setFields(id, { status: null }); render(); toast('Skip undone', () => { setFields(id, before); render(); }); break; }
    case 'form': UI.form = UI.form === id ? null : id; render(); break;
    case 'move': openMove(id); break;
    case 'mv-pick': UI.move.date = b.dataset.d; renderMove(); break;
    case 'mv-cancel': UI.move = null; closeModal(); break;
    case 'mv-ok': { const d = $('#mv-date').value; if (isValidISO(d)) doMove(UI.move.id, d); break; }
    case 'toggle-missed': { const open = UI.missedOpen === null ? missedSessions().length <= 3 : UI.missedOpen; UI.missedOpen = !open; render(); break; }
    case 'missed-all': UI.missedAll = true; render(); break;
    case 'skip-all': skipAllMissed(); break;
    case 'toast-undo': { const root = $('#toast-root'); const fn = root._undo; root.innerHTML = ''; root._undo = null; if (fn) fn(); break; }
    case 'sync': sync('manual'); break;
    case 'create-gist': createGist(); break;
    case 'connect-code': connectCode(); break;
    case 'copy-code': {
      const code = setupCode();
      const fallback = () => { const d = document.querySelector('#sync-panel details'); if (d) d.open = true; const t = $('#setup-code'); if (t) { t.focus(); t.select(); } toast('Select and copy the code shown'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => toast('Setup code copied. Treat it like a password.'), fallback); else fallback();
      break;
    }
    case 'disconnect': if (confirm('Disconnect this device from sync? Your data stays on this device.')) { CFG = { token: '', gistId: '', lastSyncAt: 0, lastSyncMark: 0, dirty: false, lastError: '' }; saveCfg(); render(); } break;
    case 'export': exportBackup(); break;
    case 'import': $('#import-file').click(); break;
    case 'csv': exportCSV(); break;
  }
});
document.addEventListener('submit', e => { if (e.target.matches('.logform')) { e.preventDefault(); saveForm(e.target); } });
document.addEventListener('change', e => { if (e.target.id === 'import-file' && e.target.files[0]) importBackup(e.target.files[0]); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.move) { UI.move = null; closeModal(); } });
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (UI.view === 'progress') drawCharts(); }, 150); });
window.addEventListener('online', () => scheduleSync(300));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (todayISO() !== TODAY && UI.viewDate === TODAY) UI.viewDate = todayISO();
  render();
  if (Date.now() - (CFG.lastSyncAt || 0) > 60000 || CFG.dirty) scheduleSync(300);
});
setInterval(renderSync, 30000);
window.addEventListener('storage', e => { if (e.key === KEY_STATE) { S = loadJSON(KEY_STATE, S); render(); } });

// ------------------------------------------------------------------ start
render();
scheduleSync(200);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
